# Bei einem Versions-Tag (git tag v1.4.0 && git push --tags): testen, Images bauen, auf dem Server ausrollen.
# Braucht die Secrets DEPLOY_HOST, DEPLOY_KEY und DEPLOY_KNOWN_HOSTS (siehe plan-saas.md, Abschnitt Deployment).
name: deploy
on:
  push:
    tags: ['v*']
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm test

      # Tag, package.json und der Versions-Text in app/index.html werden von tools/version.js gemeinsam gesetzt.
      # Weichen sie voneinander ab, ist der Tag falsch gesetzt und es wird nicht gebaut.
      - name: Versionen prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          HTML=$(sed -n 's/.*<p class="version">Version \([^<]*\)<\/p>.*/\1/p' app/index.html | head -n1)
          echo "Tag: $TAG, package.json: $PKG, app/index.html: $HTML"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$HTML" ]; then
            echo "Versionen passen nicht zusammen (Tag $TAG, package.json $PKG, app/index.html $HTML)" >&2
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/wernersbacher/musiktafel:${{ github.sha }}

      - name: Auf dem Server ausrollen
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          echo "$KEY" > ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Fingerabdrücke zum Vergleich mit ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub auf dem Server
          ssh-keygen -lf ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "deploy@$HOST" "${{ github.sha }}"
