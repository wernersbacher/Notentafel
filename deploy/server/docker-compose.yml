# Liegt auf dem Server unter /opt/musiktafel/. Das Image baut GitHub Actions, TAG setzt deploy.sh in .env.
# Der Port ist nur lokal erreichbar; nach außen geht es über den Caddy auf dem Server (reverse_proxy 127.0.0.1:${PORT}).
services:
  app:
    image: ghcr.io/wernersbacher/musiktafel:${TAG}
    env_file: .env
    ports: ["127.0.0.1:${PORT}:8090"]
    volumes: ["./pb_data:/pb/pb_data"]
    restart: unless-stopped
