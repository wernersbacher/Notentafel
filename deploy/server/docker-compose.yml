# Liegt auf dem Server unter /opt/notentafel/. Die Images baut GitHub Actions, TAG setzt deploy.sh in .env.
services:
  web:
    image: ghcr.io/wernersbacher/notentafel-web:${TAG}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      # Zertifikate behalten, sonst holt Caddy bei jedem Neustart neue (Let's Encrypt begrenzt das)
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [pb]
    restart: unless-stopped
  pb:
    image: ghcr.io/wernersbacher/notentafel-pb:${TAG}
    env_file: .env
    volumes: ["./pb_data:/pb/pb_data"]
    restart: unless-stopped
volumes:
  caddy_data: {}
  caddy_config: {}
