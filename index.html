<!doctype html><html lang="de"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Notentafel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: links die Tafel (8 Plätze pro Zeile, Zeilen füllen die Höhe), rechts die Leiste mit allen Tönen */
:root {
  --bg: #dfe5e1;
  --board: #fbfcfa;
  --frame: #aab5af;
  --frame-edge: #8d9993;
  --panel: #eef2ef;
  --fg: #18211d;
  --muted: #586861;
  --line: #bcc7c1;
  --btn: #ffffff;
  --btn-line: #c3cdc7;
  --ring: #18211d;
  --danger: #b3261e;
  --shadow: rgba(24, 33, 29, .18);
  --font-display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-ui: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --board: #1c2925; --frame: #46524d; --frame-edge: #33403a;
    --panel: #17201d; --fg: #eaf1ed; --muted: #9aaba3; --line: #41504a;
    --btn: #22302b; --btn-line: #3a4943; --ring: #eaf1ed; --danger: #ff8f86;
    --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --board: #1c2925; --frame: #46524d; --frame-edge: #33403a;
  --panel: #17201d; --fg: #eaf1ed; --muted: #9aaba3; --line: #41504a;
  --btn: #22302b; --btn-line: #3a4943; --ring: #eaf1ed; --danger: #ff8f86;
  --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(300px, 33vw, 350px);
  grid-template-rows: minmax(0, 1fr);
  gap: 14px;
}

/* ---------- Tafel ---------- */
.boardwrap { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.toast {
  position: absolute; left: 50%; bottom: 36px; z-index: 20;
  transform: translateX(-50%); width: max-content; max-width: calc(100% - 48px);
  background: var(--fg); color: var(--board);
  padding: 10px 16px; border-radius: 12px;
  font-weight: 800; font-size: .95rem; line-height: 1.3; text-align: center;
  box-shadow: 0 8px 20px var(--shadow); pointer-events: none;
}
.toast.warn { background: var(--danger); }
.board {
  flex: 1; min-height: 0; display: flex;
  background: var(--board);
  border: 10px solid var(--frame);
  border-radius: 18px 18px 6px 6px;
  box-shadow: 0 2px 0 var(--frame-edge), inset 0 2px 10px var(--shadow);
  overflow: hidden;
}
.tray {
  height: 12px; margin-inline: 10%;
  background: var(--frame);
  border-radius: 0 0 8px 8px;
  box-shadow: 0 2px 0 var(--frame-edge);
}
.grid {
  flex: 1; min-width: 0; min-height: 0;
  padding: 14px 12px;
  display: grid;
  gap: 6px;
  grid-template-rows: repeat(var(--rows, 3), minmax(0, 8.75rem));
  align-content: start;
  touch-action: none;
}
.row {
  display: grid;
  grid-template-columns: 1.5rem repeat(8, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr);
  gap: 6px;
  min-height: 0;
}
.rownum {
  align-self: center; text-align: center;
  font: 700 .85rem var(--font-ui); color: var(--muted);
}
.cell {
  container-type: size;
  display: grid; place-items: center;
  min-width: 0; min-height: 0;
  cursor: pointer; border-radius: 14px;
}
.stack {
  --d: max(24px, min(84cqw, calc(100cqh - 2.6rem)));
  display: flex; flex-direction: column; align-items: center; gap: .25rem;
}
.dot {
  width: var(--d); aspect-ratio: 1; border-radius: 50%;
  background: var(--c); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 600;
  font-size: calc(var(--d) * .5); line-height: 1;
  box-shadow: inset 0 calc(var(--d) * -.05) 0 rgba(0, 0, 0, .16);
  transition: transform .12s ease;
}
.dot.ghost {
  background: transparent; border: 3px dashed var(--line); box-shadow: none;
}
.ltr.long { font-size: .62em; }
.up .ltr { font-size: .9em; }
.arr { width: .46em; height: .46em; margin-bottom: -.02em; }
.hand {
  height: 2.3rem; min-width: 3rem; padding-inline: .6rem;
  font: 700 1.7rem/1.8rem var(--font-display);
  text-align: center; border-radius: 999px; border: 3px solid transparent;
}
/* r gefüllt, l nur umrandet – so lassen sich beide auch von weitem unterscheiden */
.hand.r { background: var(--fg); border-color: var(--fg); color: var(--board); }
.hand.l { background: var(--board); border-color: var(--fg); color: var(--fg); }
.cell.sel .dot {
  box-shadow: inset 0 calc(var(--d) * -.05) 0 rgba(0, 0, 0, .16), 0 0 0 3px var(--board), 0 0 0 6px var(--ring);
}
.cell.sel .dot.ghost { border-color: var(--ring); border-style: solid; box-shadow: 0 0 0 3px var(--board), 0 0 0 6px var(--ring); }
/* Im Einfügen-Modus zeigt ein Balken links an, dass der Ton vor diesem Platz landet */
.grid.inserting .cell.sel { position: relative; }
.grid.inserting .cell.sel::before {
  content: ""; position: absolute; left: -5px; top: 10%; bottom: 10%;
  width: 4px; border-radius: 2px; background: var(--ring);
}
.cell.playing .dot:not(.ghost) { transform: scale(1.14); }
.cell.lifting { opacity: .3; }
.cell.drop .dot { transform: scale(1.08); }
.dot.dragging {
  position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
  box-shadow: 0 14px 28px rgba(0, 0, 0, .35); transition: none;
}

/* ---------- Leiste ---------- */
.side {
  background: var(--panel);
  border-radius: 18px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; min-height: 0; min-width: 0;
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.title { font: 700 1.4rem var(--font-display); margin: 0; }
.example { margin: 0; font-size: .82rem; line-height: 1.3; color: var(--muted); border-left: 3px solid var(--line); padding-left: .6rem; }

.btn {
  font: 800 .95rem var(--font-ui);
  color: var(--fg); background: var(--btn);
  border: 2px solid var(--btn-line); border-radius: 12px;
  min-height: 48px; padding: 0 .6rem;
  display: flex; align-items: center; justify-content: center; gap: .4rem;
  cursor: pointer; touch-action: manipulation;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.on { background: var(--fg); color: var(--board); border-color: var(--fg); }
.btn .big { font: 700 1.5rem/1 var(--font-display); }
.btn .small { font-size: .78rem; font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.confirm { background: var(--danger); border-color: var(--danger); color: var(--board); }
.ico { width: 1.25rem; height: 1.25rem; flex: none; }
.btn .big .ico { width: 1.5rem; height: 1.5rem; display: block; }

.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tools .btn { flex-direction: column; gap: .15rem; min-height: 58px; padding: .3rem .15rem; }
.tools .btn .small { font-size: .72rem; }

.palette { display: flex; flex-direction: column; gap: 16px; }
.pal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.note {
  aspect-ratio: 1; border: 0; border-radius: 50%;
  background: var(--c); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font: 600 1.9rem/1 var(--font-display);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .16);
  cursor: pointer; touch-action: manipulation; padding: 0;
}
.note:active { transform: scale(.93); }
.note.up .ltr { font-size: .9em; }
.note .ltr.long { font-size: .66em; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.actions .play { grid-column: 1 / -1; }

/* ---------- Menü (Slide-in) ---------- */
.backdrop {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(0, 0, 0, .35);
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 90;
  width: min(380px, 100vw);
  background: var(--panel); color: var(--fg);
  box-shadow: -10px 0 30px var(--shadow);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) 16px;
  display: flex; flex-direction: column; gap: 18px;
  overflow-y: auto; overscroll-behavior: contain;
  transform: translateX(105%); visibility: hidden;
  transition: transform .22s ease, visibility 0s linear .22s;
}
.drawer.open { transform: none; visibility: visible; transition: transform .22s ease; }
.drawer h2 { font: 700 1.3rem var(--font-display); margin: 0; }
.drawer h3 { font: 800 .8rem var(--font-ui); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.drawer .hint { margin: 6px 0 0; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
.drawer .hint.warn { color: var(--danger); }
.saverow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.saverow input {
  font: 700 16px var(--font-ui); color: var(--fg); background: var(--btn);
  border: 2px solid var(--btn-line); border-radius: 12px;
  min-height: 48px; padding: 0 .75rem; min-width: 0;
  -webkit-user-select: text; user-select: text;
}
.songs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.song {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center;
  background: var(--btn); border: 2px solid var(--btn-line); border-radius: 12px; padding: 6px 6px 6px 12px;
}
.song.current { border-color: var(--fg); }
.song.one { grid-template-columns: minmax(0, 1fr) auto; }
.song .name { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song .date { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); }
.song .btn { min-height: 44px; font-size: .85rem; }
.empty { margin: 0; font-size: .88rem; color: var(--muted); }
.themes { display: flex; flex-direction: column; gap: 8px; }
.theme {
  text-align: left; flex-direction: column; align-items: stretch; gap: 6px;
  padding: 10px 12px; font-weight: 700;
}
.theme .desc { font-size: .78rem; font-weight: 700; opacity: .8; }
.swatches { display: flex; gap: 5px; }
.swatches span { width: 22px; height: 22px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--board); }
.temporow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.temporow input { width: 100%; min-height: 44px; accent-color: var(--fg); }
.temporow output { font-weight: 800; min-width: 6.5em; text-align: right; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
  .boardwrap { height: min(62vh, 520px); min-height: 340px; }
  .side { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  .dot, .drawer, .drawer.open { transition: none; }
  .btn:active:not(:disabled), .note:active { transform: none; }
}
</style>

<div class="app">
  <div class="boardwrap">
    <div class="board"><div class="grid" id="grid" aria-label="Notentafel"></div></div>
    <div class="tray" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <aside class="side" aria-label="Werkzeuge">
    <div class="head">
      <h1 class="title">Notentafel</h1>
      <button type="button" class="btn" id="btnMenu" aria-haspopup="dialog" aria-controls="drawer">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Menü
      </button>
    </div>
    <p class="example" id="example">Beispielmelodie „Hänschen klein“. Mit „Alles löschen“ beginnst du neu.</p>

    <div class="tools">
      <button type="button" class="btn" id="btnR" title="Rechte Hand"><span class="big">r</span><span class="small">rechts</span></button>
      <button type="button" class="btn" id="btnL" title="Linke Hand"><span class="big">l</span><span class="small">links</span></button>
      <button type="button" class="btn" id="btnIns" aria-pressed="false" title="Töne einfügen statt überschreiben">
        <span class="big"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M11 12h9M16 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="small">einfügen</span>
      </button>
      <button type="button" class="btn" id="btnDel" title="Ton entfernen">
        <span class="big"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></span><span class="small" id="delLabel">entfernen</span>
      </button>
    </div>

    <div class="palette" id="palette"></div>

    <div class="actions">
      <button type="button" class="btn play" id="btnPlay"></button>
      <button type="button" class="btn" id="btnUndo">Rückgängig</button>
      <button type="button" class="btn danger" id="btnClear">Alles löschen</button>
      <button type="button" class="btn" id="btnAddRow">+ Zeile</button>
      <button type="button" class="btn" id="btnDelRow">− Zeile</button>
    </div>
  </aside>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" inert>
  <div class="head">
    <h2 id="drawerTitle">Menü</h2>
    <button type="button" class="btn" id="btnClose" aria-label="Menü schließen">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <section>
    <h3>Lied speichern</h3>
    <div class="saverow">
      <input id="songName" type="text" maxlength="40" placeholder="Name des Lieds" autocomplete="off" enterkeyhint="done">
      <button type="button" class="btn" id="btnSave">Speichern</button>
    </div>
    <p class="hint" id="saveHint" aria-live="polite"></p>
  </section>

  <section id="autoSec" hidden>
    <h3>Zuletzt ersetzt</h3>
    <div class="song one" id="autosave"></div>
    <p class="hint">Die Tafel vor dem letzten Laden oder „Alles löschen“.</p>
  </section>

  <section>
    <h3>Gespeicherte Lieder</h3>
    <ul class="songs" id="songs"></ul>
  </section>

  <section>
    <h3>Bekannte Lieder</h3>
    <ul class="songs" id="melodies"></ul>
  </section>

  <section>
    <h3>Farben</h3>
    <div class="themes" id="themes"></div>
  </section>

  <section>
    <h3>Tempo beim Abspielen</h3>
    <div class="temporow">
      <input type="range" id="tempo" min="50" max="160" step="5" aria-label="Tempo">
      <output id="tempoOut" for="tempo"></output>
    </div>
  </section>
</aside>

<script src="notentafel.js"></script>

</body></html>
